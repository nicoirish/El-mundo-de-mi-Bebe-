<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffc2d6">
<title>El Mundo de mi Cachetitos — La Cajita de Ternurita</title>
<style>
:root{--sandia:#e8457d;--sandia-d:#cf2f68;--rosa:#ffc2d6;--rosa-p:#ffe4ee;--lav:#d9c8f5;--crema:#fff7ee;--menta:#bdecd4;--mant:#ffe9a8;--azul:#bcd8ff;--ink:#4f2340;--ink2:#6f3f5d;--night:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:ui-rounded,"Nunito","Quicksand","Trebuchet MS",system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.5;background:#ffd9e6;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #6b4cff;outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-style:italic;margin:0;line-height:1.15;font-weight:700}
h2{font-size:1.3rem}
p{margin:0}
.ico{width:100%;height:100%;display:block;overflow:visible}
.small{font-size:.92rem;color:var(--ink2)}
/* cielo */
#sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#ffd3e3,#f1d3f7 50%,#cfe3ff)}
#sky .nightl{position:absolute;inset:0;background:linear-gradient(#564d9e,#9a73c9 55%,#ffb3cf);opacity:var(--night);transition:opacity 2.5s}
#stars span{position:absolute;color:#fff;opacity:0;transition:opacity 2s;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.6)}}
.cloud{position:absolute;width:150px;height:75px;opacity:.7;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(115vw)}}
/* layout */
#app{min-height:100dvh;display:flex;flex-direction:column}
#hud{position:sticky;top:0;z-index:15;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;max-width:460px;width:100%;margin:0 auto}
.hbtn{position:relative;min-width:48px;height:48px;border-radius:24px;background:rgba(255,247,238,.92);box-shadow:0 4px 14px #b4558833;font-size:1.35rem;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 12px}
.hbtn .badge{font-size:.78rem;font-weight:800;color:var(--sandia-d)}
.hgrp{display:flex;gap:8px}
#stage{max-width:460px;width:100%;margin:0 auto;padding:6px 14px 100px;display:flex;flex-direction:column;gap:12px;flex:1}
.card{background:rgba(255,247,238,.94);border-radius:24px;padding:16px 18px;box-shadow:0 8px 26px #b4558826;position:relative}
.card.pad{padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 24px;border-radius:30px;background:linear-gradient(#f0568d,var(--sandia-d));color:#fff;font-weight:800;box-shadow:0 6px 16px #cf2f6844;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink);box-shadow:0 3px 10px #b4558822;font-weight:700}
.btn.danger{background:#fff;color:#a3153f;border:2px solid #cf2f68}
.btn.big{width:100%;font-size:1.1rem;min-height:56px}
.btn.small{min-height:44px;padding:8px 18px;font-size:.95rem}
.btn.block{width:100%;justify-content:flex-start}
.btn[disabled]{opacity:.5}
.pulse{animation:pul 1.8s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.04);box-shadow:0 0 0 8px #ff5c8a22}}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none;z-index:20}
#dock>*{pointer-events:auto}
#bAsk{background:rgba(255,247,238,.92);border-radius:24px;padding:10px 14px;font-size:.85rem;font-weight:700;color:var(--ink);min-height:44px;box-shadow:0 4px 12px #b4558833}
.audio{display:flex;gap:8px}
.audio button{width:48px;height:48px;border-radius:24px;background:rgba(255,247,238,.92);box-shadow:0 4px 12px #b4558833;font-size:1.15rem}
/* modal, toast, partículas */
.modal{position:fixed;inset:0;z-index:50;background:#4f234066;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--crema);border-radius:28px;padding:22px 20px;max-width:420px;width:100%;max-height:90dvh;overflow:auto;text-align:center;box-shadow:0 20px 50px #4f234066;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mbox h2{margin-bottom:6px}
.rw{width:130px;height:130px;margin:6px auto 10px;position:relative}
.rw::before{content:"";position:absolute;inset:-34px;border-radius:50%;background:conic-gradient(from 0deg,#ffe9a855,#ff8fb355,#ffe9a855,#d9c8f555,#ffe9a855);animation:spin 12s linear infinite;-webkit-mask:radial-gradient(circle,#000 38%,transparent 70%);mask:radial-gradient(circle,#000 38%,transparent 70%)}
.rw .ico{position:relative;animation:bob 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-6px)}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:.95rem;z-index:60;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.pt{position:fixed;pointer-events:none;z-index:70;font-size:20px;animation:pt .95s ease-out forwards}
@keyframes pt{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
/* título */
.titleart{width:100%;max-width:420px;margin:0 auto;display:block}
.title{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:14px}
.title h1{font-size:2.5rem;color:#fff;text-shadow:0 3px 0 #cf2f68,0 6px 18px #4f234066}
.title .sub{background:rgba(255,247,238,.92);padding:10px 16px;border-radius:20px;max-width:340px}
.floaty{animation:bob 4s ease-in-out infinite}
.link{text-decoration:underline;color:var(--ink);font-size:.9rem;padding:10px;background:rgba(255,247,238,.7);border-radius:16px}
/* intro */
.letter-in{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.avbig{width:120px;height:165px}
.avatar{overflow:visible}
.opts{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.sw1{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #4f234033}
.sw1.sel{outline:3px solid var(--sandia-d);outline-offset:2px}
.accb{min-width:44px;height:44px;border-radius:22px;background:#fff;border:2px solid var(--rosa);padding:0 12px;font-size:.9rem;font-weight:700}
.accb.sel{background:var(--rosa);border-color:var(--sandia-d)}
/* mapa */
.mapcard{display:flex;gap:12px;align-items:center}
.mapav{width:46px;height:64px;flex:none}
.map{position:relative;width:100%;aspect-ratio:100/160}
.mapbg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-62%);display:flex;flex-direction:column;align-items:center;gap:4px;width:130px}
.orb{position:relative;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe4ee);box-shadow:0 6px 16px #b4558844,inset 0 -4px 8px #ffc2d6;padding:12px;transition:transform .2s}
.node:active .orb{transform:scale(.92)}
.node.open .orb{animation:pul 2.2s ease-in-out infinite}
.node.locked .orb{filter:grayscale(.7);opacity:.7}
.node.locked .orb .ico{opacity:.35}
.nl{background:rgba(255,247,238,.95);padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:800;line-height:1.25;text-align:center}
.tick{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--sandia-d);color:#fff;font-size:.85rem;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.mist{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;text-shadow:0 2px 8px #7a4a68}
/* misiones */
.mhead{display:flex;gap:12px;align-items:center}
.mi{width:56px;height:56px;flex:none;background:var(--rosa-p);border-radius:18px;padding:8px}
.garden{position:relative;width:100%;aspect-ratio:1/1.15;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 20% 15%,#fff7,transparent 40%),linear-gradient(#d9f5e5,#a9e2c6 55%,#8fd3b2);box-shadow:inset 0 -12px 30px #5ab58a55}
.garden .fl{position:absolute;width:44px;height:44px}
.sway{animation:sway 3.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{50%{transform:rotate(7deg)}}
.straw{position:absolute;width:56px;height:56px;padding:4px;z-index:2;transition:transform .4s,opacity .4s}
.straw.found{transform:scale(1.3) translateY(-8px);opacity:.35;pointer-events:none}
.straw.hint{animation:pul .6s 4}
.cover{z-index:3;pointer-events:none}
.gcount{position:absolute;top:10px;right:10px;background:rgba(255,247,238,.95);padding:4px 14px;border-radius:16px;font-weight:800;z-index:5}
.fire{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff6a8;box-shadow:0 0 10px 3px #fff6a8;animation:fire 5s ease-in-out infinite}
@keyframes fire{50%{transform:translate(16px,-20px);opacity:.3}}
.plate{width:100%;max-width:300px;margin:0 auto;display:block}
.ly{opacity:0;transform:translateY(-28px);transition:opacity .6s,transform .6s}
.ly.on{opacity:1;transform:none}
.clue{background:var(--rosa-p);border-radius:18px;padding:10px 14px;text-align:center;min-height:62px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ing{display:flex;align-items:center;gap:8px;min-height:56px;background:#fff;border:2px solid var(--rosa);border-radius:18px;padding:6px 10px;font-weight:700;font-size:.9rem;text-align:left;line-height:1.2}
.ing .sw{width:30px;height:30px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 1px 4px #0003;display:block}
.ing .ico{width:30px;height:30px;flex:none}
.ing[disabled]{opacity:.45;background:var(--menta)}
.ing.glow{animation:pul .8s infinite;border-color:var(--sandia-d)}
.wig{animation:wig .4s}
@keyframes wig{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scorebar{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-weight:800}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--sandia-d)}
#court{width:100%;display:block;border-radius:18px;background:linear-gradient(#e8d9ff,#ffe4ee 60%,#cfe3ff);touch-action:manipulation}
.spin{transform-origin:98px 120px;animation:spin 8s linear infinite}
.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.cols>div{display:flex;flex-direction:column;gap:8px}
.wd,.mn{min-height:58px;border-radius:14px;padding:8px 10px;font-weight:700;font-size:.92rem;line-height:1.25;text-align:left;border:2px solid transparent;box-shadow:0 3px 8px #b4558822}
.wd{background:linear-gradient(90deg,#d9c8f5,#f2e9ff);border-left:8px solid #a98ae0;font-family:Georgia,serif;font-style:italic;font-size:1rem}
.mn{background:#fff}
.wd.sel,.mn.sel{border-color:var(--sandia-d);transform:scale(1.03)}
.wd.ok,.mn.ok{background:var(--menta);border-color:#5ab58a;opacity:.85}
.shelf{display:flex;gap:8px;justify-content:center;padding:10px;background:linear-gradient(#f4d9bd,#e8c9a8);border-radius:16px;margin-bottom:10px}
.shelf .slot{width:52px;height:52px;border-radius:12px;background:#fff7ee99;padding:6px;opacity:.5;transition:.5s}
.shelf .slot.on{opacity:1;background:#fff;transform:translateY(-4px)}
.studio{display:flex;flex-direction:column;gap:10px}
.prev{width:min(58%,220px);margin:0 auto;filter:drop-shadow(0 8px 14px #b4558844)}
.lbl{font-weight:800;font-size:.9rem;margin-bottom:4px}
.swrow{display:flex;gap:8px;flex-wrap:wrap}
.cb{width:46px;height:46px;border-radius:14px;border:3px solid #fff;box-shadow:0 2px 8px #4f234033}
.cb.sel{outline:3px solid var(--sandia-d);outline-offset:2px}
.eb{width:52px;height:52px;border-radius:14px;background:#fff;padding:8px;border:2px solid var(--rosa)}
.eb.sel{border-color:var(--sandia-d);background:var(--rosa-p)}
.pb{background:#fff;border:2px solid var(--rosa);border-radius:16px;padding:6px 12px;font-size:.88rem;font-weight:700;min-height:44px}
.pb.sel{border-color:var(--sandia-d);background:var(--rosa-p)}
.txt{width:100%;min-height:48px;border-radius:16px;border:2px solid var(--rosa);padding:8px 14px;font:inherit;background:#fff;color:var(--ink)}
.plantsvg{width:100%;max-width:300px;margin:0 auto;display:block}
.plantsvg .grow{transform-origin:120px 190px;animation:grow .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes grow{from{transform:scale(.6);opacity:.3}}
.drop{animation:dropf 1s ease-in forwards}
@keyframes dropf{from{opacity:1;transform:translateY(-20px)}to{opacity:0;transform:translateY(40px)}}
.refuge{width:100%;display:block;border-radius:22px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips2 span{padding:4px 12px;border-radius:16px;background:#fff;font-size:.85rem;font-weight:700;border:2px solid var(--rosa)}
.chips2 span.on{background:var(--menta);border-color:#5ab58a}
.lant{cursor:pointer}
.lant .gl{opacity:0;transition:opacity .5s}
.lant.on .gl{opacity:1}
.lant.on .lb{fill:#ffe27a}
/* rincón */
.nooksvg{width:100%;display:block;border-radius:26px;box-shadow:0 10px 30px #b4558844;touch-action:manipulation}
.pi{cursor:pointer}
.hotc{fill:#fff3;stroke:#fff;stroke-width:3;stroke-dasharray:6 6;opacity:.7}
.hotc.sel{opacity:1;stroke:#ff5c8a;animation:pul 1.2s infinite;transform-box:fill-box;transform-origin:center}
.selring{fill:none;stroke:#ff5c8a;stroke-width:3;stroke-dasharray:4 5}
.tray{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.chip{flex:none;width:92px;background:#fff;border-radius:18px;border:2px solid var(--rosa);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:800;text-align:center;line-height:1.15}
.chip .ci{width:46px;height:46px}
.chip i{font-style:normal;font-weight:600;color:var(--ink2)}
.chip.sel{border-color:var(--sandia-d);background:var(--rosa-p)}
.chip.put i{color:#2d8a5b}
.bar{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.bounce{animation:bounceb 1.6s ease-in-out infinite}
@keyframes bounceb{50%{transform:translateY(-8px)}}
/* caja */
.boxhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.boxsvg{width:200px;height:170px}
.boxgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bcard{background:rgba(255,247,238,.95);border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:0 6px 18px #b4558826;font-size:.85rem;line-height:1.25;min-height:190px}
.bcard .bi{width:72px;height:72px;background:radial-gradient(circle,#fff,var(--rosa-p));border-radius:20px;padding:8px}
.bcard b{font-size:.95rem}
.bcard.locked{background:rgba(255,247,238,.6)}
.bcard.locked .bi .ico{filter:brightness(0);opacity:.15}
.bcard .tag{font-size:.75rem;color:#2d8a5b;font-weight:800}
.prog{width:100%;height:12px;background:#fff;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ff8fb3,var(--sandia-d));border-radius:6px;transition:width .8s}
/* final */
.fbox{position:relative;height:330px;display:flex;align-items:center;justify-content:center}
.fbox .bsv{width:230px;height:195px;position:relative;z-index:2}
.bsv .lid{transform-box:fill-box;transform-origin:left bottom;transition:transform 1.5s cubic-bezier(.3,1.3,.5,1)}
.fbox.open .lid{transform:translate(-6px,-40px) rotate(-16deg)}
.bsv .rays{opacity:0;transition:opacity 1.5s}
.fbox.open .rays{opacity:1}
.fi{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;transition:transform 2.2s cubic-bezier(.2,1,.3,1),opacity 1.4s;opacity:0;z-index:3}
.fi.go{opacity:1}
#fstars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fstars span{position:absolute;color:#ff9fc2;opacity:0;transition:opacity 1.6s;text-shadow:0 0 8px #ffc2d6}
#fstars span.on{opacity:.95}
.ltxt{white-space:pre-wrap;font-family:Georgia,serif;font-size:1.04rem;line-height:1.65;min-height:60px}
.fin{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rest{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;padding:30px 18px}
.breath{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffc2d6 60%,#d9c8f5);box-shadow:0 0 50px #fff9;animation:breath 8s ease-in-out infinite;padding:34px}
@keyframes breath{50%{transform:scale(1.22)}}
.phrase{font-family:Georgia,serif;font-style:italic;font-size:1.25rem;min-height:3.2em}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.cloud{display:none}}
</style>
</head>

 const G=(id,inner)=>`<g class="pi" data-act="pick" data-id="${id}" tabindex="0" role="button" aria-label="${esc(ITEMS[id].name)}">${inner}</g>`;
 if(P.m6&&own('m6'))s+=G('m6','<circle cx="190" cy="270" r="96" fill="#ffe9a8" opacity=".3"/><use href="#i-tree" x="105" y="168" width="170" height="204"/>');
 if(P.m4&&own('m4'))s+=G('m4','<circle cx="324" cy="320" r="30" fill="#fff6c2" opacity=".5"/><use href="#i-book" x="300" y="296" width="48" height="48"/>');
 if(P.m5&&own('m5')&&S.poster)s+=G('m5',posterSVG(S.poster,'x="32" y="270" width="66" height="88"'));
 if(P.m3&&own('m3'))s+=G('m3','<ellipse cx="85" cy="450" rx="18" ry="5" fill="#4f234033"/><circle cx="85" cy="408" r="28" fill="#fff6c2" opacity=".5"/><g class="bounce"><use href="#i-ball" x="65" y="388" width="40" height="40"/></g>');
 if(P.m2&&own('m2'))s+=G('m2','<use href="#i-fountain" x="272" y="396" width="62" height="68"/>');
 s+=avatarSVG({},'x="112" y="372" width="56" height="77"');
 if(P.m1&&own('m1'))s+=G('m1','<use href="#i-pot" x="165" y="455" width="52" height="52"/>');
 /* puntos para colocar y selección */
 MIS.forEach(mi=>{const id=mi.id;if(!own(id))return;const it=ITEMS[id];
  if(!P[id])s+=`<g data-act="place" data-id="${id}" tabindex="0" role="button" aria-label="Colocar ${esc(it.name)} aquí"><circle class="hotc ${sel===id?'sel':''}" cx="${it.cx}" cy="${it.cy}" r="30"/><circle cx="${it.cx}" cy="${it.cy}" r="38" fill="transparent"/></g>`;
  else if(sel===id)s+=`<circle class="selring" cx="${it.cx}" cy="${it.cy}" r="${id==='m6'?96:42}"/>`});
 return s+'</svg>';
}
SCREENS.nook=function(st,arg){
 const view=!!(arg&&arg.view);let sel=null;
 const owned=()=>MIS.filter(m=>S.done[m.id]);
 if(!view){const f=owned().find(m=>!S.placed[m.id]);if(f)sel=f.id}
 function draw(){
  const o=owned();
  st.innerHTML=`<section class="card"><h2>Mi rinconcito mágico</h2><p class="small">${view?'Respira. No hay nada que hacer aquí, solo mirar.':o.length?'Elige un objeto y toca su lugar brillante para colocarlo.':'Todavía no tienes objetos. Cuando encuentres alguno, aparecerá aquí.'}</p></section>${nookSVG(view?null:sel)}
  ${view?'<div class="row"><button class="btn" id="keep">Seguir decorando 🏡</button><button class="btn ghost" id="tomap">Volver al mapa</button></div>':o.length?`<div class="tray">${o.map(m=>`<button class="chip ${sel===m.id?'sel':''} ${S.placed[m.id]?'put':''}" data-c="${m.id}"><div class="ci">${ico(ITEMS[m.id].icon)}</div><span>${esc(ITEMS[m.id].short)}</span><i>${S.placed[m.id]?'✓ puesto':'en la caja'}</i></button>`).join('')}</div><div class="bar card" id="bar"></div>`:'<div class="row"><button class="btn" id="tomap">Ir al mapa</button></div>'}`;
  const bar=$('#bar');
  if(bar){if(sel){const it=ITEMS[sel],pl=!!S.placed[sel];bar.innerHTML=`<b>${esc(it.name)}</b><span class="small">${esc(it.desc)}</span><button class="btn small" id="tg">${pl?'Guardar en la caja':'Colocar en mi rinconcito'}</button>`;$('#tg').onclick=()=>{S.placed[sel]=!pl;save();sfx(pl?'soft':'good');const keep=sel;draw();if(!pl)burstEl($(`[data-id="${keep}"]`,st),10)}}else bar.innerHTML='<span class="small">Toca un objeto para elegirlo.</span>'}
  $$('.chip',st).forEach(c=>c.onclick=()=>{sel=c.dataset.c;sfx('pop');draw()});
  const svg=$('#nookSvg');
  svg.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||view)return;const id=t.dataset.id;if(t.dataset.act==='place'){S.placed[id]=true;save();sel=id;sfx('good');draw();burstEl($(`.pi[data-id="${id}"]`,st),12)}else{sel=id;sfx('pop');draw()}});
  svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest&&e.target.closest('[data-act]');if(t){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}});
  const k=$('#keep');if(k)k.onclick=()=>go('nook',null,true);const tm=$('#tomap');if(tm)tm.onclick=()=>go('map');
 }
 draw();
};

/* ============ descanso ============ */
SCREENS.rest=function(st){
 st.innerHTML=`<section class="card rest"><div class="breath">${ico('i-moon')}</div><p class="phrase" id="ph" aria-live="polite">${esc(pick(CONFIG.phrases))}</p><div class="row"><button class="btn ghost" id="oth">Otra frasecita</button><button class="btn" id="ret">Volver cuando quieras</button></div></section>`;
 $('#oth').onclick=()=>{$('#ph').textContent=pick(CONFIG.phrases);sfx('soft')};$('#ret').onclick=()=>go('map');
};
function readSomething(){const m=modal(`<h2>Algo bonito</h2><p class="phrase" id="rp" style="min-height:3em">${esc(pick(CONFIG.phrases))}</p>`,[{label:'Otra',cls:'ghost',fn:readSomething},{label:'Cerrar'}])}

/* ============ final ============ */
SCREENS.final=function(st){
 if(!S.done.m7){go('map',null,true);return}
 setSky(true);
 const own=MIS.filter(m=>S.done[m.id]);
 st.innerHTML=`<div id="fstars"></div><div class="fbox" id="fb">${boxSVG()}${own.map((m,i)=>`<div class="fi" data-i="${i}">${ico(ITEMS[m.id].icon)}</div>`).join('')}</div><div class="row" id="opw"><button class="btn big pulse" id="opn">Abrir la caja ✨</button></div><section class="card" id="lt" hidden><div class="ltxt" id="ltxt" aria-live="polite"></div><div class="row" style="margin-top:10px"><button class="btn ghost small" id="skip">Mostrar todo</button></div></section><div class="fin" id="fin" hidden><button class="btn" id="f1">Contemplar mi universo 🌙</button><button class="btn ghost" id="f2">Volver al mapa</button><button class="btn ghost" id="f3">Abrir la Caja de Ternurita</button><button class="btn ghost" id="f4">Modificar mi decoración</button><button class="link" id="f5">Reiniciar la aventura</button></div>`;
 /* estrellas rosadas que se encienden poco a poco */
 const fs=$('#fstars');let nst=0;const spawn=()=>{if(nst>=44)return;nst++;const sp=document.createElement('span');sp.textContent='✦';sp.style.cssText=`left:${rand(2,96).toFixed(1)}%;top:${rand(2,92).toFixed(1)}%;font-size:${Math.round(rand(10,24))}px`;fs.appendChild(sp);requestAnimationFrame(()=>requestAnimationFrame(()=>sp.classList.add('on')))};
 let tm=null;if(RM){for(let i=0;i<44;i++)spawn()}else tm=setInterval(spawn,220);
 let tt=null;onLeave(()=>{clearInterval(tm);clearInterval(tt);document.body.classList.remove('fin')});
 let opened=false;
 $('#opn').onclick=()=>{if(opened)return;opened=true;$('#opw').hidden=true;$('#fb').classList.add('open');sfx('open');
  const r=$('#fb').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,22);
  $$('.fi',st).forEach((e,i,all)=>{const a=-Math.PI/2+(i/all.length)*Math.PI*2,rad=118;setTimeout(()=>{e.classList.add('go');e.style.transform=`translate(${Math.cos(a)*rad}px,${Math.sin(a)*rad*.85}px)`},500+i*150)});
  setTimeout(()=>{$('#lt').hidden=false;$('#lt').scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});typeLetter()},2200)};
 function typeLetter(){const txt=CONFIG.finalParagraphs.join('\n\n'),el=$('#ltxt');let i=0;
  const end=()=>{clearInterval(tt);tt=null;el.textContent=txt;$('#skip').hidden=true;$('#fin').hidden=false;if(!S.finalSeen){S.finalSeen=true;save()}};
  if(RM){end();return}
  tt=setInterval(()=>{i+=2;el.textContent=txt.slice(0,i);if(i>=txt.length)end()},38);
  $('#skip').onclick=end}
 $('#f1').onclick=()=>go('nook',{view:true});$('#f2').onclick=()=>go('map');$('#f3').onclick=()=>go('box');$('#f4').onclick=()=>go('nook');$('#f5').onclick=confirmReset;
};

/* ============ reinicio y preguntas ============ */
function confirmReset(){modal('<h2>¿Reiniciar la aventura?</h2><p>Se borrarán tus objetos, tu decoración y tu cartel. Esto no se puede deshacer.</p>',[{label:'Mejor no, quiero conservar todo'},{label:'Sí, reiniciar',cls:'danger',fn:()=>{S=defState();save();histo=[];setSky(false);go('title',null,true)}}])}
function ask(){
 const next=()=>{for(let i=0;i<7;i++)if(isOpen(i)&&!S.done[MIS[i].id])return MIS[i].id;return null};
 modal('<h2>¿Qué te gustaría hacer ahora? 💗</h2><p class="small">Lo que tú quieras, a tu ritmo.</p>',[
 {label:'🗺️ Explorar el mundo',cls:'ghost block',fn:()=>go('map')},
 {label:'🎮 Jugar una misión',cls:'ghost block',fn:()=>{const n=next();if(n)go('mission',n);else{toast('Ya visitaste todos los rincones 💗');go('map')}}},
 {label:'🏡 Decorar mi rincón',cls:'ghost block',fn:()=>go('nook')},
 {label:'🌙 Descansar un poquito',cls:'ghost block',fn:()=>go('rest')},
 {label:'📖 Leer algo bonito',cls:'ghost block',fn:readSomething},
 {label:'Seguir como estaba',cls:'ghost block'}]);
}

/* ============ arranque ============ */
$('#bBack').onclick=back;$('#bMap').onclick=()=>go('map');$('#bNook').onclick=()=>go('nook');$('#bBox').onclick=()=>go('box');$('#bAsk').onclick=ask;$('#bMusic').onclick=toggleMusic;$('#bMute').onclick=toggleMute;
window.__PAU={go:go,complete:complete,get state(){return S},get cur(){return cur}};
syncAudio();go('title',null,true);
})();
</script>
